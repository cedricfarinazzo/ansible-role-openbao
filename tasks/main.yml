---
# Every input first, then the plugin downloads (a bad checksum stops before any install)
- name: Validate the inputs
  ansible.builtin.import_tasks: validate.yml

- name: Download and check the plugins
  ansible.builtin.import_tasks: plugins.yml

- name: Install OpenBao
  ansible.builtin.import_tasks: install.yml

- name: TLS certificate
  ansible.builtin.import_tasks: tls.yml

- name: Configuration and environment
  ansible.builtin.import_tasks: config.yml

# Only when a start is due (not running, or a change that restarts it): a rerun with no change skips it
- name: OAEP check on the seal's key, before OpenBao starts (one PIN login)
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - openbao
      - -p
      - --
      - /usr/local/sbin/openbao-pkcs11-oaep-check
      - "{{ openbao_seal.pkcs11.lib }}"
      - "{{ openbao_seal.pkcs11.slot if openbao_seal.pkcs11.slot is defined else 'label:' ~ openbao_seal.pkcs11.token_label }}"
      - "{{ openbao_seal.pkcs11.key_id }}"
      - "{{ openbao_seal.pkcs11.rsa_oaep_hash | default('sha256') }}"
  environment: "{{ openbao_environment }}"
  register: openbao_oaep
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - openbao_pkcs11_oaep_check
    - openbao_service_start
    - not ansible_check_mode
    - openbao_start_due | bool

- name: Stop before any start if the OAEP check failed (OpenBao never retried the seal)
  ansible.builtin.assert:
    that: openbao_oaep.rc == 0
    fail_msg: >-
      OAEP check failed (rc {{ openbao_oaep.rc }}): {{ openbao_oaep.stderr | default('') | trim }}
      {{ openbao_oaep.stdout | default('') | trim }}. Check the PIN tries left before any new start.
    quiet: true
  when: openbao_oaep is not skipped

- name: Start OpenBao
  ansible.builtin.systemd_service:
    name: openbao
    state: started
    enabled: true
    daemon_reload: true
  when:
    - openbao_service_start
    - not openbao_fresh_check

- name: Apply a changed configuration now
  ansible.builtin.meta: flush_handlers

- name: Wait for the API (sealed or not initialized is fine here)
  ansible.builtin.uri:
    url: "{{ openbao_local_addr }}/v1/sys/health"
    ca_path: "{{ openbao_tls_ca_file }}"
    status_code: [200, 429, 472, 473, 501, 503]
  register: openbao_health
  retries: 30
  delay: 2
  until: openbao_health.status in [200, 429, 472, 473, 501, 503]
  when: openbao_service_start and not ansible_check_mode

- name: Read the running seal
  ansible.builtin.uri:
    url: "{{ openbao_local_addr }}/v1/sys/seal-status"
    ca_path: "{{ openbao_tls_ca_file }}"
  register: openbao_seal_status
  when: openbao_service_start and not ansible_check_mode and openbao_seal | length > 0

- name: Assert the running seal is the configured one
  ansible.builtin.assert:
    that: openbao_seal_status.json.type == openbao_seal.keys() | first
    fail_msg: "OpenBao runs with seal {{ openbao_seal_status.json.type }}, not {{ openbao_seal.keys() | first }}"
    quiet: true
  when: openbao_seal_status is not skipped
