---
# Post-init: run after `bao operator init`, with a root token given at run time.
# The token is never written: every task that carries it has no_log.
- name: Assert a root token is given at run time
  ansible.builtin.assert:
    that: openbao_root_token is string and openbao_root_token | length > 0
    fail_msg: "Give the root token at run time (-e openbao_root_token=... or a vars prompt); it is never stored"
    quiet: true

- name: Assert the post-init inputs
  ansible.builtin.assert:
    that:
      - openbao_secrets_engines | rejectattr('path', 'defined') | list | length == 0
      - openbao_secrets_engines | rejectattr('type', 'defined') | list | length == 0
      - openbao_transit_keys | rejectattr('mount', 'defined') | list | length == 0
      - openbao_transit_keys | rejectattr('name', 'defined') | list | length == 0
      - openbao_policies | rejectattr('name', 'defined') | list | length == 0
      - openbao_policies | rejectattr('rules', 'defined') | list | length == 0
      - openbao_token_roles | rejectattr('name', 'defined') | list | length == 0
      - openbao_token_roles | rejectattr('allowed_policies', 'defined') | list | length == 0
      - openbao_token_roles | selectattr('period', 'defined') | rejectattr('period', 'integer') | list | length == 0
    fail_msg: >-
      Engines need path and type, transit keys mount and name, policies name and rules,
      token roles name and allowed_policies (period in seconds, an integer)
    quiet: true

- name: Assert OpenBao is initialized, unsealed and active
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/sys/health"
    ca_path: "{{ openbao_tls_cert_file }}"
    status_code: 200

- name: Read the mounts
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/sys/mounts"
    ca_path: "{{ openbao_tls_cert_file }}"
    headers: {X-Vault-Token: "{{ openbao_root_token }}"}
  register: openbao_mounts
  no_log: true

- name: Enable each secrets engine
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/sys/mounts/{{ item.path }}"
    method: POST
    ca_path: "{{ openbao_tls_cert_file }}"
    headers: {X-Vault-Token: "{{ openbao_root_token }}"}
    body_format: json
    body: {type: "{{ item.type }}", description: "{{ item.description | default('') }}"}
    status_code: 204
  loop: "{{ openbao_secrets_engines | rejectattr('path', 'in', openbao_mounts.json.data.keys() | map('regex_replace', '/$', '')) | list }}"
  loop_control:
    label: "{{ item.path }} ({{ item.type }})"
  changed_when: true
  no_log: true

- name: Read each transit key
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/{{ item.mount }}/keys/{{ item.name }}"
    ca_path: "{{ openbao_tls_cert_file }}"
    headers: {X-Vault-Token: "{{ openbao_root_token }}"}
    status_code: [200, 404]
  loop: "{{ openbao_transit_keys }}"
  loop_control:
    label: "{{ item.mount }}/{{ item.name }}"
  register: openbao_keys_read
  no_log: true

- name: Create each missing transit key
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/{{ item.item.mount }}/keys/{{ item.item.name }}"
    method: POST
    ca_path: "{{ openbao_tls_cert_file }}"
    headers: {X-Vault-Token: "{{ openbao_root_token }}"}
    body_format: json
    body: {type: "{{ item.item.type | default('aes256-gcm96') }}"}
    status_code: [200, 204]
  loop: "{{ openbao_keys_read.results | selectattr('status', 'equalto', 404) | list }}"
  loop_control:
    label: "{{ item.item.mount }}/{{ item.item.name }}"
  changed_when: true
  no_log: true

- name: Read each policy
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/sys/policies/acl/{{ item.name }}"
    ca_path: "{{ openbao_tls_cert_file }}"
    headers: {X-Vault-Token: "{{ openbao_root_token }}"}
    status_code: [200, 404]
  loop: "{{ openbao_policies }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_policies_read
  no_log: true

- name: Write each missing or changed policy
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/sys/policies/acl/{{ item.item.name }}"
    method: PUT
    ca_path: "{{ openbao_tls_cert_file }}"
    headers: {X-Vault-Token: "{{ openbao_root_token }}"}
    body_format: json
    body: {policy: "{{ item.item.rules }}"}
    status_code: 204
  loop: "{{ openbao_policies_read.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.status == 404 or item.json.data.policy != item.item.rules
  changed_when: true
  no_log: true

- name: Read each token role
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/auth/token/roles/{{ item.name }}"
    ca_path: "{{ openbao_tls_cert_file }}"
    headers: {X-Vault-Token: "{{ openbao_root_token }}"}
    status_code: [200, 404]
  loop: "{{ openbao_token_roles }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_roles_read
  no_log: true

- name: Write each missing or changed token role
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/auth/token/roles/{{ item.item.name }}"
    method: POST
    ca_path: "{{ openbao_tls_cert_file }}"
    headers: {X-Vault-Token: "{{ openbao_root_token }}"}
    body_format: json
    body: "{{ openbao_role_body }}"
    status_code: 204
  vars:
    openbao_role_body:
      allowed_policies: "{{ item.item.allowed_policies }}"
      token_period: "{{ item.item.period | default(0) }}"
      orphan: "{{ item.item.orphan | default(false) }}"
      renewable: "{{ item.item.renewable | default(true) }}"
  loop: "{{ openbao_roles_read.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: >-
    item.status == 404
    or (item.json.data.allowed_policies | sort) != (item.item.allowed_policies | sort)
    or item.json.data.token_period != (item.item.period | default(0))
    or item.json.data.orphan != (item.item.orphan | default(false))
    or item.json.data.renewable != (item.item.renewable | default(true))
  changed_when: true
  no_log: true
