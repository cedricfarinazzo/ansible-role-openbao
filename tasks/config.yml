---
- name: Drop-in directory of the unit
  ansible.builtin.file:
    path: /etc/systemd/system/openbao.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Plugin directory
  ansible.builtin.file:
    path: "{{ openbao_plugin_directory }}"
    state: directory
    owner: root
    group: openbao
    mode: "0750"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install each checked plugin binary
  ansible.builtin.copy:
    src: "{{ openbao_plugin_cache }}/{{ item.name }}-{{ item.version }}/{{ item.binary }}"
    dest: "{{ openbao_plugin_directory }}/{{ item.binary }}"
    remote_src: true
    owner: root
    group: openbao
    mode: "0750"
  loop: "{{ openbao_plugins }}"
  loop_control:
    label: "{{ item.binary }}"
  notify: Restart OpenBao
  ignore_errors: "{{ ansible_check_mode }}"

- name: Server configuration
  ansible.builtin.copy:
    dest: "{{ openbao_config_file }}"
    content: "{{ openbao_config | to_nice_json }}\n"
    owner: root
    group: openbao
    mode: "0640"
    validate: bao operator validate-config -config=%s
  notify: Restart OpenBao
  ignore_errors: "{{ ansible_check_mode }}"

# Read by systemd as root before it drops to the openbao user
- name: Server environment
  ansible.builtin.template:
    src: openbao.env.j2
    dest: "{{ openbao_env_file }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  notify: Restart OpenBao
  ignore_errors: "{{ ansible_check_mode }}"

- name: Service restart policy
  ansible.builtin.copy:
    dest: /etc/systemd/system/openbao.service.d/ansible.conf
    content: |
      # Managed by Ansible: every failed start retries the seal (and an HSM login)
      [Unit]
      StartLimitIntervalSec={{ openbao_service_start_limit_interval_sec }}
      StartLimitBurst={{ openbao_service_start_limit_burst }}

      [Service]
      Restart={{ openbao_service_restart }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart OpenBao
  ignore_errors: "{{ ansible_check_mode }}"

- name: Client settings for operators and scripts (no secret)
  ansible.builtin.copy:
    dest: "{{ openbao_client_env_file }}"
    content: |
      # Managed by Ansible: source it, then run bao
      BAO_ADDR={{ openbao_local_addr }}
      BAO_CACERT={{ openbao_tls_cert_file }}
      export BAO_ADDR BAO_CACERT
    owner: root
    group: root
    mode: "0644"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Token script
  ansible.builtin.copy:
    src: openbao-token-create
    dest: /usr/local/sbin/openbao-token-create
    owner: root
    group: root
    mode: "0755"
  when: openbao_token_script
