---
- name: Assert the install inputs
  ansible.builtin.assert:
    that:
      - openbao_version is string and openbao_version is match('^[0-9]+\.[0-9]+\.[0-9]+\Z')
      # Without facts (a check-only play, gather_facts: false) the family is checked at install
      - ansible_facts['os_family'] is not defined or ansible_facts['os_family'] in ['Debian', 'RedHat']
      - openbao_gpg_key_fingerprint is string and openbao_gpg_key_fingerprint is match('^[0-9A-F]{40}\Z')
      - openbao_apt_repo_url is match('^https://')
      - openbao_release_url is match('^https://')
      - openbao_gpg_key_url is match('^https://')
      - openbao_packages_extra is sequence and openbao_packages_extra is not string
      - openbao_user_groups is sequence and openbao_user_groups is not string
      - openbao_pcsc_access is boolean
    fail_msg: >-
      The Debian or RedHat family only; openbao_version is an exact x.y.z, openbao_gpg_key_fingerprint 40 upper-case hex, the URLs https,
      openbao_packages_extra and openbao_user_groups lists, openbao_pcsc_access a boolean
    quiet: true

- name: Assert the server inputs
  ansible.builtin.assert:
    that:
      - openbao_api_addr is string and openbao_api_addr is match('^https?://[A-Za-z0-9.:\[\]-]+(:[0-9]+)?\Z')
      - openbao_cluster_addr is match('^https://')
      - openbao_listener_address is match('^[A-Za-z0-9.\[\]:-]*:[0-9]+\Z')
      - openbao_storage is mapping and openbao_storage | length == 1
      - openbao_seal is mapping and openbao_seal | length <= 1
      - openbao_seal_previous is mapping and openbao_seal_previous | length <= 1
      - openbao_seal_previous | length == 0 or (openbao_seal_previous.values() | first) is mapping
      - openbao_seal_previous | length == 0 or openbao_seal_previous != openbao_seal
      - openbao_config_extra is mapping
      - openbao_ui is boolean
      - openbao_tls_self_signed is boolean
      - openbao_tls_subject_alt_names is sequence and openbao_tls_subject_alt_names is not string
      - openbao_tls_subject_alt_names | reject('match', '^(IP|DNS):[A-Za-z0-9.:*-]+\Z') | list | length == 0
      - openbao_tls_valid_days is integer and openbao_tls_valid_days > 0
      - openbao_tls_common_name is string and openbao_tls_common_name | length > 0
      - >-
        [openbao_tls_dir, openbao_tls_cert_file, openbao_tls_key_file, openbao_tls_ca_file, openbao_plugin_directory]
        | reject('match', '^/\S*\Z') | list | length == 0
      - openbao_addr is string and openbao_addr is match('^https://[A-Za-z0-9.:\[\]-]+:[0-9]+\Z')
      - openbao_token_script is boolean
      - openbao_cluster_listen_address is match('^[A-Za-z0-9.\[\]:-]*:[0-9]+\Z')
      - openbao_listener_options is mapping
      - openbao_listeners_extra is sequence and openbao_listeners_extra is not string
      - openbao_listeners_extra | reject('mapping') | list | length == 0
      - openbao_log_level in ['trace', 'debug', 'info', 'warn', 'error']
      - openbao_log_format in ['standard', 'json']
      - openbao_telemetry is mapping
      - openbao_service_start is boolean
      - openbao_service_restart in ['no', 'on-success', 'on-failure', 'on-abnormal', 'on-watchdog', 'on-abort', 'always']
      - openbao_service_start_limit_interval_sec is integer and openbao_service_start_limit_interval_sec >= 0
      - openbao_service_start_limit_burst is integer and openbao_service_start_limit_burst > 0
      - openbao_service_after is sequence and openbao_service_after is not string
      - openbao_service_after | select('match', '^[A-Za-z0-9:_.@-]+[.][a-z]+\Z') | list | length == openbao_service_after | length
      - openbao_service_before is sequence and openbao_service_before is not string
      - openbao_service_before | select('match', '^[A-Za-z0-9:_.@-]+[.][a-z]+\Z') | list | length == openbao_service_before | length
    fail_msg: >-
      openbao_api_addr is required (https://host:port), openbao_listener_address host:port, openbao_storage one
      backend, openbao_seal at most one seal, openbao_seal_previous at most one seal and not openbao_seal itself, SANs IP:... or DNS:..., openbao_tls_valid_days a positive integer,
      openbao_service_start a boolean, openbao_service_restart a systemd Restart= value, the start limits integers,
      openbao_service_after and openbao_service_before lists of unit names, the TLS and plugin paths absolute, openbao_tls_common_name set, openbao_addr https://host:port,
      openbao_token_script a boolean, openbao_listener_options a mapping, openbao_listeners_extra a list of
      mappings, openbao_log_level trace/debug/info/warn/error, openbao_log_format standard/json, openbao_telemetry a mapping
    quiet: true

# Role defaults and parameters are not in other hosts' hostvars: publish what the members read from each other
- name: Publish this node's address and snapshot setting to the other members
  ansible.builtin.set_fact:
    openbao_node_api_addr: "{{ openbao_api_addr }}"
    openbao_node_backup_enabled: "{{ openbao_backup_enabled }}"

- name: Assert the cluster inputs
  ansible.builtin.assert:
    that:
      - openbao_cluster_group is string
      - openbao_raft_retry_join is sequence and openbao_raft_retry_join is not string
      - openbao_cluster_group == '' or openbao_cluster_group in groups
      - openbao_cluster_group == '' or inventory_hostname in openbao_cluster_members
      - openbao_cluster_group == '' or openbao_cluster_members | reject('in', ansible_play_hosts_all) | list | length == 0
      - openbao_cluster_group == '' or openbao_storage.raft is defined
      - openbao_cluster_group == '' or openbao_cluster_addr is not search('//(127\\.|localhost|\\[::1\\])')
      - openbao_cluster_group == '' or openbao_cluster_listen_address is not match('^(127\\.|localhost|\\[::1\\])')
      - >-
        openbao_cluster_group == '' or openbao_cluster_members | map('extract', hostvars, 'openbao_node_api_addr')
        | unique | list | length == openbao_cluster_members | length
    fail_msg: >-
      openbao_cluster_group names an inventory group holding this host, with every member in the play (the
      certificate bundle and retry_join read them all); a cluster needs raft storage, a cluster address and
      listener off loopback, and one openbao_api_addr per member
    quiet: true

- name: Assert the audit devices
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.type | default('') in ['file', 'syslog', 'socket', 'http']
      - item.path | default('') is match('^[A-Za-z0-9_.-]+/?\Z')
      - item.options | default({}) is mapping
      - item.options | default({}) | dict2items | map(attribute='value') | reject('string') | list | length == 0
      - item.type != 'file' or item.options.file_path is defined
    fail_msg: >-
      Each audit device needs type (file, syslog, socket, http), path, and options with string values
      (file: file_path, e.g. {{ openbao_audit_log_dir }}/audit.log, or stdout)
    quiet: true
  loop: "{{ openbao_audit_devices }}"
  loop_control:
    label: "{{ item.type | default('?') }}/{{ item.path | default('?') }}"

- name: Assert the audit paths and the snapshots
  ansible.builtin.assert:
    that:
      - openbao_audit_devices | map(attribute='path') | unique | list | length == openbao_audit_devices | length
      - openbao_file_audit_paths | reject('match', '^' ~ (openbao_audit_log_dir | regex_escape) ~ '/[^/\n\r]+\Z') | list | length == 0
      - openbao_audit_logrotate is boolean
      - openbao_audit_logrotate_keep is integer and openbao_audit_logrotate_keep > 0
      - openbao_backup_enabled is boolean
      - openbao_backup_dir is match('^/\S*\Z')
      - openbao_backup_schedule is string and openbao_backup_schedule | length > 0
      - openbao_backup_keep is integer and openbao_backup_keep > 0
      - openbao_backup_token_period is integer and openbao_backup_token_period >= 3600
      - not openbao_backup_enabled or openbao_storage.raft is defined
    fail_msg: >-
      Audit paths unique; a file device writes directly under {{ openbao_audit_log_dir }} (the unit lets OpenBao
      write there); the keep counts positive integers; snapshots need raft storage and a token period of 3600 s or more
    quiet: true

- name: Assert the OAEP check can be built from the seal
  ansible.builtin.assert:
    that:
      - openbao_pkcs11_oaep_check is boolean
      - not openbao_pkcs11_oaep_check or (openbao_seal.pkcs11 is defined and openbao_seal.pkcs11.lib is defined)
      - not openbao_pkcs11_oaep_check or openbao_seal.pkcs11.key_id | default('') is match('^[0-9a-fA-F]+\Z')
      - not openbao_pkcs11_oaep_check or (openbao_seal.pkcs11.slot is defined or openbao_seal.pkcs11.token_label is defined)
      - not openbao_pkcs11_oaep_check or openbao_seal.pkcs11.rsa_oaep_hash | default('sha256') in ['sha1', 'sha224', 'sha256', 'sha384', 'sha512']
    fail_msg: >-
      openbao_pkcs11_oaep_check needs openbao_seal.pkcs11 with lib, key_id (hex), slot or token_label,
      and rsa_oaep_hash sha1/sha224/sha256/sha384/sha512 (default sha256)
    quiet: true

- name: Assert the plugins
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.type | default('') in openbao_plugin_types
      - item.name | default('') is match('^[a-z0-9_-]+\Z')
      - item.version | default('') is match('^v[0-9]+\.[0-9]+\.[0-9]+')
      - item.url | default('') is match('^https://.+\.tar\.gz\Z')
      - item.checksum | default('') is match('^[0-9a-f]{64}\Z')
      - item.binary | default('') is match('^[A-Za-z0-9._-]+\Z')
      - item.binary_sha256 | default('') is match('^[0-9a-f]{64}\Z')
      - item.args | default([]) is sequence and item.args | default([]) is not string
      - item.env | default([]) is sequence and item.env | default([]) is not string
    fail_msg: >-
      Each plugin needs type ({{ openbao_plugin_types | join(', ') }}), name, version (vX.Y.Z), url (.tar.gz, https),
      checksum and binary_sha256 (64 lower-case hex) and binary (a file name); args and env are lists
    quiet: true
  loop: "{{ openbao_plugins }}"
  loop_control:
    label: "{{ item.type | default('?') }}/{{ item.name | default('?') }}"

- name: Assert the environment (values are never printed)
  ansible.builtin.assert:
    that:
      - openbao_environment is mapping
      - openbao_environment.keys() | reject('match', '^[A-Z_][A-Z0-9_]*\Z') | list | length == 0
      - openbao_environment.values() | reject('string') | list | length == 0
      - openbao_environment.values() | select('search', '[\n\r]') | list | length == 0
      - openbao_environment_required is sequence and openbao_environment_required is not string
    fail_msg: openbao_environment maps NAME to a one-line string; openbao_environment_required is a list of names
    quiet: true
  no_log: true

- name: Assert the required environment is set
  ansible.builtin.assert:
    that: openbao_environment_missing | length == 0
    fail_msg: "Unset or empty in openbao_environment: {{ openbao_environment_missing | join(', ') }}"
    quiet: true
  vars:
    openbao_environment_missing: >-
      {{ openbao_environment_required
         | reject('in', openbao_environment | dict2items | rejectattr('value', 'equalto', '') | map(attribute='key') | list)
         | list }}
