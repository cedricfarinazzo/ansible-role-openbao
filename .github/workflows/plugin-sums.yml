name: plugin-sums

# A kms-pkcs11 version bump in the Molecule scenario (Renovate) comes without its sums: compute them and
# commit them to the pull request. That push's pull_request runs wait for approval (a GITHUB_TOKEN push):
# a maintainer approves them on the pull request.
#
# pull_request_target: this file and the script always come from main, never from the pull request, which
# cannot change what runs with the write token. The pull request's branch is checked out as data only:
# no credentials stored, nothing from it executed. Its values reach the shell through env, never ${{ }}.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: [molecule/default/molecule.yml]

permissions: {}

concurrency:
  group: plugin-sums-${{ github.event.pull_request.number }}

jobs:
  sums:
    # Renovate's branches of this repository only
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: The script, from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      - name: The pull request's branch, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Sums for molecule_plugin_version
        id: sums
        run: |
          {
            echo "lines<<EOF_SUMS"
            base/.github/scripts/plugin-sums.sh pr/molecule/default/molecule.yml
            echo "EOF_SUMS"
          } >> "$GITHUB_OUTPUT"

      - name: Commit changed sums
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SUMS: ${{ steps.sums.outputs.lines }}
        run: |
          cd pr
          if git diff --quiet; then echo "sums up to date"; exit 0; fi
          ver=$(sed -n 's/^ *molecule_plugin_version: *//p' molecule/default/molecule.yml)
          [[ $ver =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -a -F - <<MSG
          chore(deps): kms-pkcs11 $ver sums for the Molecule scenario

          The archive and binary sha256 of kms-pkcs11 $ver, computed by the plugin-sums workflow
          from the kms-pkcs11-$ver release of openbao/openbao-plugins: each archive is checked against
          the release's checksums-kms-pkcs11.txt, then the archive and the unpacked binary are hashed.

          $SUMS
          MSG
          # The token reaches git for this push only
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push "https://github.com/$REPO.git" "HEAD:refs/heads/$BRANCH"
