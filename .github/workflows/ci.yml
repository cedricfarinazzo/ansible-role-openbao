name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - run: yamllint .
      # Galaxy refuses the import of a description over 255 characters
      - name: Galaxy description length
        run: |
          python -c "
          import sys, yaml
          d = yaml.safe_load(open('meta/main.yml'))['galaxy_info']['description']
          sys.exit(f'meta/main.yml description: {len(d)} characters, Galaxy accepts 255') if len(d) > 255 else print(len(d), 'characters')
          "
      - run: ansible-lint
      - run: shellcheck files/* run-tests.sh

  molecule:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian12
          - debian13
          - ubuntu2404
          - ubuntu2604
          - rockylinux9
          - rockylinux10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ansible-core in requirements-dev.txt needs Python 3.13+
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Run the molecule scenario on ${{ matrix.distro }}
        run: ./run-tests.sh ${{ matrix.distro }}

  molecule-cluster:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Run the three-node cluster scenario on debian13
        run: ./run-tests.sh -s cluster debian13

  molecule-seal-migration:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Run the seal-migration scenario on debian13
        run: ./run-tests.sh -s seal-migration debian13
