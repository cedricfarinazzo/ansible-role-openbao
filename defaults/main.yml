---
# --- Install -----------------------------------------------------------------
# Exact OpenBao version: the official apt repository (Debian family) or the signed GitHub release (RedHat family)
# renovate: datasource=github-releases depName=openbao/openbao
openbao_version: "2.7.2"
openbao_apt_repo_url: https://pkgs.openbao.org/deb
# RedHat family: <url>/v<version>/openbao_<version>_linux_<arch>.rpm, checked against the signed checksums.txt
openbao_release_url: https://github.com/openbao/openbao/releases/download
openbao_gpg_key_url: https://openbao.org/assets/openbao-gpg-pub-20240618.asc
# The downloaded key must carry this fingerprint, alone, or nothing is installed
openbao_gpg_key_fingerprint: 66D15FDD87287219C8E15478D200CD702853E6D0
# More packages, e.g. a PKCS#11 module and its daemon: [pcscd, ykcs11, opensc]
openbao_packages_extra: []
# Extra groups for the openbao user (e.g. softhsm, to read a SoftHSM token)
openbao_user_groups: []
# polkit rule letting the openbao user talk to pcscd (a smart card or a YubiKey)
openbao_pcsc_access: false

# --- External plugins (manual download, checksum checked before any install) --
openbao_plugin_directory: /opt/openbao/plugins
# Each: {type, name, version, url, checksum, binary, binary_sha256, args?, env?}
#   url: a .tar.gz release archive; checksum: its sha256; binary: the file in it;
#   binary_sha256: the binary's sha256, rechecked by OpenBao before each start
openbao_plugins: []

# --- Cluster -----------------------------------------------------------------
# Inventory group of the raft nodes; "" = a single node. Every member must be in the play.
openbao_cluster_group: ""
# retry_join entries; default: one per member, leader_api_addr its openbao_api_addr, trusting openbao_tls_ca_file
openbao_raft_retry_join: "{{ openbao_cluster_retry_join_default }}"

# --- TLS ---------------------------------------------------------------------
# true: a self-signed certificate generated on the host (the key never leaves it)
# false: supply openbao_tls_cert_file and openbao_tls_key_file yourself
openbao_tls_self_signed: true
openbao_tls_dir: /opt/openbao/tls
openbao_tls_cert_file: "{{ openbao_tls_dir }}/tls.crt"
openbao_tls_key_file: "{{ openbao_tls_dir }}/tls.key"
# CA that clients (and the role) trust. Self-signed: the certificate itself, or in a cluster a bundle of every
# member's certificate. Else: your CA bundle.
openbao_tls_ca_file: "{{ openbao_tls_dir ~ '/ca-bundle.pem' if openbao_cluster_group | length > 0 else openbao_tls_cert_file }}"
openbao_tls_common_name: "{{ ansible_facts['fqdn'] }}"
# e.g. ["IP:192.0.2.10", "DNS:bao.example.org"]; 127.0.0.1, localhost and the host of openbao_api_addr are always added
openbao_tls_subject_alt_names: []
openbao_tls_valid_days: 3650

# --- Server configuration ------------------------------------------------------
openbao_listener_address: "0.0.0.0:8200"
# Merged into the TCP listener, e.g. {tls_min_version: tls13, x_forwarded_for_authorized_addrs: [...],
# telemetry: {unauthenticated_metrics_access: true}}
openbao_listener_options: {}
# More listener stanzas, e.g. [{unix: {address: /run/openbao/bao.sock}}]
openbao_listeners_extra: []
# Address clients use, e.g. https://192.0.2.10:8200 (required)
openbao_api_addr: ""
# Single node: loopback. Cluster: the host of openbao_api_addr, port 8201, listening on every address.
openbao_cluster_addr: "{{ openbao_cluster_addr_default }}"
openbao_cluster_listen_address: "{{ '127.0.0.1:8201' if openbao_cluster_group == '' else '0.0.0.0:8201' }}"
openbao_storage:
  raft:
    path: /opt/openbao/data
    node_id: "{{ inventory_hostname }}"
# Seal stanza, e.g. {pkcs11: {lib: ..., slot: "0", key_id: "03"}}; {} = Shamir keys
openbao_seal: {}
openbao_ui: false
# trace, debug, info, warn, error
openbao_log_level: info
# standard or json
openbao_log_format: standard
# telemetry stanza, e.g. {prometheus_retention_time: 24h, disable_hostname: true}; {} = none
openbao_telemetry: {}
# Each: {type, path, description?, local?, options: {...}} (option values are strings; a file device's file_path).
# Declared in the configuration: OpenBao refuses audit devices created through the API.
openbao_audit_devices: []
# Rotation of the file audit logs under this directory (logrotate, then SIGHUP)
openbao_audit_log_dir: /var/log/openbao
openbao_audit_logrotate: true
openbao_audit_logrotate_keep: 14
# Merged last into the configuration (any other top-level OpenBao setting)
openbao_config_extra: {}

# Environment of the server (/etc/openbao/openbao.env, root 0400), e.g. {BAO_HSM_PIN: ...}
openbao_environment: {}
# Names that must be set and non-empty in openbao_environment, or the role stops
openbao_environment_required: []

# --- Service -------------------------------------------------------------------
# false: install and configure only, neither started nor enabled (e.g. test an HSM PIN by hand first)
openbao_service_start: true
# Each automatic restart retries the seal, and so the HSM login: with a PIN retry counter (a YubiKey
# locks after 3 wrong PINs) set "no" and alert on the service instead. The limits count manual starts too.
openbao_service_restart: on-failure
openbao_service_start_limit_interval_sec: 60
openbao_service_start_limit_burst: 3

# Before each start or restart: an RSA-OAEP round trip on the seal's PKCS#11 key, as the openbao user with
# the server environment (one PIN login). A failure stops the run before OpenBao retries the seal itself.
# Needs pkcs11-tool (opensc) and an RSA key; reads lib, slot or token_label, key_id, rsa_oaep_hash from openbao_seal.
openbao_pkcs11_oaep_check: false

# --- Raft snapshots ----------------------------------------------------------
# A systemd timer saving a raft snapshot; its token (periodic, snapshot read only) is created by the post-init part
openbao_backup_enabled: false
openbao_backup_dir: /var/backups/openbao
# systemd OnCalendar
openbao_backup_schedule: daily
# Snapshots kept (the newest)
openbao_backup_keep: 7
# The token's period in seconds: the timer renews it at each run
openbao_backup_token_period: 604800

# --- Post-init configuration (tasks_from: configure) --------------------------
# Defaults to the listener on this host
openbao_addr: "{{ openbao_local_addr }}"
# Given at run time only (-e or a vars prompt); never stored by the role
openbao_root_token: ""
# Every item below takes state: present (default) or absent. Durations are read back in seconds:
# give them in seconds, or every run reports a change.
# Each: {path, type, description?, config?: {default_lease_ttl, max_lease_ttl, ...}, options?: {version: "2"}}
openbao_secrets_engines: []
# Each: {path, type, description?, config?: {...}} (config: the mount tuning, as for engines)
openbao_auth_methods: []
# Each: {mount, name, type?, exportable?, auto_rotate_period?, deletion_allowed?, ...} (type defaults to aes256-gcm96)
openbao_transit_keys: []
# Each: {name, rules} (rules: the policy in HCL)
openbao_policies: []
# Each: {name, allowed_policies, ...any token role parameter: orphan, token_period, token_explicit_max_ttl, token_bound_cidrs, ...}
openbao_token_roles: []
# Any other API object, e.g. {path: auth/approle/role/app, data: {token_policies: [app], token_ttl: 3600}}.
# Only the keys given are compared; one the API never reads back (a password) is written on creation only.
openbao_api_resources: []
# Install openbao-token-create (a periodic or role token, printed once to stdout)
openbao_token_script: false
