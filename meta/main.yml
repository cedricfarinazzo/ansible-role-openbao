---
galaxy_info:
  role_name: openbao
  namespace: cedricfarinazzo
  author: Cédric Farinazzo
  description: >-
    OpenBao server or raft cluster from the signed official packages: auto-unseal (PKCS#11, KMS, static), TLS,
    audit devices, raft snapshots, and post-init auth methods, engines, transit keys, policies and token roles

  license: MIT

  min_ansible_version: "2.15"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - noble
        - resolute
    - name: EL
      versions:
        - "9"
        - "10"

  galaxy_tags:
    - openbao
    - vault
    - secrets
    - pkcs11
    - hsm
    - unseal
    - security

dependencies: []
