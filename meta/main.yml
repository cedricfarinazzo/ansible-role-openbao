---
galaxy_info:
  role_name: openbao
  namespace: cedricfarinazzo
  author: Cédric Farinazzo
  description: >-
    OpenBao server or raft cluster from the official packages: KMS plugins with checksums, auto-unseal (PKCS#11,
    ...), self-signed TLS, audit devices, telemetry, raft snapshots, secrets in a root-only environment file, and
    post-init auth methods, engines, transit keys, policies, token roles and any API object

  license: MIT

  min_ansible_version: "2.15"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - noble
        - resolute
    - name: EL
      versions:
        - "9"
        - "10"

  galaxy_tags:
    - openbao
    - vault
    - secrets
    - pkcs11
    - hsm
    - unseal
    - security

dependencies: []
